x-application: &application
  image: eclipse-temurin:21-jre@sha256:227118764cccd3c3294617061aaa93a08309c63a395eefa83e6b35032992ea99
  volumes:
    - ./target/sample-cache-database-mssql-0.14.0.jar:/app/sample.jar:ro
  mem_limit: 768m
  cpus: 2
  environment:
    DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=cachedb_sample;encrypt=false;trustServerCertificate=true;loginTimeout=5
    DB_USERNAME: sa
    DB_PASSWORD: YourStrong!Passw0rd
    REDIS_URI: redis://redis:6379
    SERVER_ADDRESS: 0.0.0.0
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0 -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
  depends_on:
    redis:
      condition: service_healthy
    sql-init:
      condition: service_completed_successfully

services:
  api:
    <<: *application
    command: [java, -jar, /app/sample.jar, "--spring.profiles.active=demo,client", --spring.sql.init.mode=never]
    ports:
      - "127.0.0.1:${SAMPLE_HTTP_PORT:-8092}:8092"
  worker:
    <<: *application
    command: [java, -jar, /app/sample.jar, "--spring.profiles.active=demo,worker"]
