name: Public Maven Repository Publish

on:
  workflow_dispatch:
    inputs:
      targetRef:
        description: Stable tag to publish, for example v0.10.0
        required: true
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: public-maven-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Resolve stable release ref
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ inputs.targetRef }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $releaseRef = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:TARGET_REF } else { $env:RELEASE_TAG }
          if ($releaseRef -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Public Maven repository only accepts stable semantic-version tags: $releaseRef"
          }
          "ref=$releaseRef" >> $env:GITHUB_OUTPUT
          "version=$($releaseRef.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Checkout release source
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0
          path: source

      - name: Import checksum-verified published release artifacts
        working-directory: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $bundle = "cache-database-$env:RELEASE_VERSION-github-release.zip"
          gh release download $env:RELEASE_REF --repo $env:GITHUB_REPOSITORY --pattern $bundle --pattern "$bundle.sha256" --dir target/published-release
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the canonical release bundle.' }
          $path = Join-Path 'target/published-release' $bundle
          $expected = ((Get-Content -LiteralPath "$path.sha256" -Raw).Trim() -split '\s+')[0]
          if ($expected -notmatch '^[a-fA-F0-9]{64}$' -or (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected) { throw 'Release bundle checksum mismatch.' }
          ./tools/release/import-release-artifacts.ps1 -Version $env:RELEASE_VERSION -ArchivePath $path

      - name: Checkout persistent public repository branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir public-repository
          cd public-repository
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin public-maven; then
            git checkout -B public-maven FETCH_HEAD
          else
            git checkout --orphan public-maven
          fi

      - name: Add immutable Maven artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./source/tools/release/build-public-maven-repository.ps1 `
            -Version $env:RELEASE_VERSION `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'public-repository') `
            -SkipBuild `
            -PreserveExisting

      - name: Commit public Maven repository state
        shell: bash
        working-directory: public-repository
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Public Maven repository already contains this immutable release."
          else
            git commit -m "Publish CacheDB $RELEASE_VERSION"
            git push origin HEAD:public-maven
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages artifact without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-site
          cp -a public-repository/. public-site/
          rm -rf public-site/.git

      - name: Upload Maven repository site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
