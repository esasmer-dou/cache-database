name: Maven Central Publish

on:
  workflow_dispatch:
    inputs:
      gaRelease:
        description: Additionally require full Production GA evidence; stable 0.19+ source/workflow gates are always mandatory
        required: true
        default: "false"
      releaseTag:
        description: Stable publication tag; defaults to the workflow ref name and must match checked-out source
        required: false
        default: ""
      targetRef:
        description: Branch or ref that must have green production evidence when gaRelease is true
        required: false
        default: main
      migrationCoverageCsvPath:
        description: Committed CSV path for full production route coverage
        required: false
        default: docs/ga-migration-coverage.csv

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Java and Central credentials
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Require stable publication source and workflow evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_TAG: ${{ inputs.releaseTag }}
          PUBLICATION_REF: ${{ github.ref_name }}
          PUBLICATION_REPOSITORY: ${{ github.repository }}
          PUBLICATION_TARGET: ${{ inputs.targetRef }}
          PUBLICATION_COVERAGE: ${{ inputs.migrationCoverageCsvPath }}
          PUBLICATION_FULL_GA: ${{ inputs.gaRelease }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          STAGING_REDIS_URI: ${{ secrets.STAGING_REDIS_URI }}
          STAGING_POSTGRES_URL: ${{ secrets.STAGING_POSTGRES_URL }}
          STAGING_POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
          STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          STAGING_MSSQL_URL: ${{ secrets.STAGING_MSSQL_URL }}
          STAGING_MSSQL_USER: ${{ secrets.STAGING_MSSQL_USER }}
          STAGING_MSSQL_PASSWORD: ${{ secrets.STAGING_MSSQL_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$pom = Get-Content -LiteralPath pom.xml -Raw
          $version = [string]$pom.project.version
          $stable = $version -match '^\d+\.\d+\.\d+$'
          if (!$stable -and $env:PUBLICATION_FULL_GA -ne 'true') {
            Write-Host 'Non-stable coordinates: stable release gate does not apply.'
            return
          }
          $releaseTag = $env:PUBLICATION_TAG
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $releaseTag = $env:PUBLICATION_REF
          }
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$' -or $version -cne $releaseTag.Substring(1)) {
            throw 'Stable publication requires the matching immutable release tag, not an arbitrary branch.'
          }
          $tagSha = git rev-parse --verify "refs/tags/$releaseTag^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Publication tag does not exist.' }
          $head = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $tagSha) { throw 'Publication HEAD differs from the release tag.' }
          $dirty = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Publication source must be clean.' }
          # Old immutable releases cannot acquire new checker APIs or historical workflow requirements.
          $legacy = [version]$version -lt [version]'0.19.0'
          if ($legacy -and $env:PUBLICATION_FULL_GA -ne 'true') {
            Write-Host 'Verified immutable pre-0.19 source; preserving legacy publication requirements.'
            return
          }
          $targetRef = $env:PUBLICATION_TARGET
          if ([string]::IsNullOrWhiteSpace($targetRef)) {
            $targetRef = "main"
          }
          $arguments = @{
            Repository = $env:PUBLICATION_REPOSITORY
            TargetRef = $targetRef
            ReleaseTag = $releaseTag
            CoverageCsvPath = $env:PUBLICATION_COVERAGE
            SummaryPath = './target/ga-release-readiness-summary.md'
            RequireMavenCentralPublish = $true
          }
          if ($legacy) {
            $arguments.SkipMavenCentralPublishCheck = $true
          } else {
            $arguments.PrePublication = $true
            $arguments.EvidenceScope = if ($env:PUBLICATION_FULL_GA -eq 'true') { 'ProductionGA' } else { 'FrameworkPackage' }
          }
          ./tools/ci/check-ga-release-readiness.ps1 @arguments

      - name: Publish GA preflight summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./target/ga-release-readiness-summary.md) {
            Get-Content ./target/ga-release-readiness-summary.md >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload GA preflight summary
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ga-release-preflight
          path: target/ga-release-readiness-summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish signed artifacts to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          mvn -B -P oss-release
          -DskipTests
          -Dgpg.skip=false
          -Dgpg.passphrase="${GPG_PASSPHRASE}"
          deploy
