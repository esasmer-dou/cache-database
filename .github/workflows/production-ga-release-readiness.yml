name: Production GA Release Readiness

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Stable GA tag to verify, for example v1.0.0
        required: true
        default: v1.0.0
      targetRef:
        description: Branch or ref that must have green production evidence
        required: true
        default: main
      evidenceScope:
        description: Package distribution or full GA approval (requires Data Guard evidence)
        required: true
        default: ProductionGA
        type: choice
        options:
          - ProductionGA
          - FrameworkPackage
      migrationCoverageCsvPath:
        description: Committed CSV path for full production route coverage
        required: true
        default: docs/ga-migration-coverage.csv
      requireManagedStagingHa:
        description: Require managed Redis and MSSQL staging HA workflow evidence
        required: true
        default: "false"
      requireApplicationMigrationCoverage:
        description: Require a full consuming-application migration coverage CSV
        required: true
        default: "false"
      requireMavenCentralPublish:
        description: Require a successful Maven Central Publish workflow for the tag
        required: true
        default: "false"
  release:
    types:
      - published

permissions:
  actions: read
  contents: read

jobs:
  ga-release-readiness:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve readiness inputs
        id: inputs
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
          INPUT_TAG: ${{ inputs.releaseTag }}
          INPUT_TARGET: ${{ inputs.targetRef }}
          INPUT_COVERAGE: ${{ inputs.migrationCoverageCsvPath }}
          INPUT_SCOPE: ${{ inputs.evidenceScope }}
          INPUT_MANAGED_HA: ${{ inputs.requireManagedStagingHa }}
          INPUT_COVERAGE_REQUIRED: ${{ inputs.requireApplicationMigrationCoverage }}
          INPUT_CENTRAL: ${{ inputs.requireMavenCentralPublish }}
        run: |
          if ($env:EVENT_NAME -eq "release") {
            "releaseTag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
            if ([string]::IsNullOrWhiteSpace($env:RELEASE_TARGET)) {
              "targetRef=main" >> $env:GITHUB_OUTPUT
            } else {
              "targetRef=$env:RELEASE_TARGET" >> $env:GITHUB_OUTPUT
            }
            "coverageCsv=docs/ga-migration-coverage.csv" >> $env:GITHUB_OUTPUT
            "evidenceScope=FrameworkPackage" >> $env:GITHUB_OUTPUT
          } else {
            "releaseTag=$env:INPUT_TAG" >> $env:GITHUB_OUTPUT
            "targetRef=$env:INPUT_TARGET" >> $env:GITHUB_OUTPUT
            "coverageCsv=$env:INPUT_COVERAGE" >> $env:GITHUB_OUTPUT
            "evidenceScope=$env:INPUT_SCOPE" >> $env:GITHUB_OUTPUT
            "requireManagedStagingHa=$env:INPUT_MANAGED_HA" >> $env:GITHUB_OUTPUT
            "requireApplicationMigrationCoverage=$env:INPUT_COVERAGE_REQUIRED" >> $env:GITHUB_OUTPUT
            "requireMavenCentralPublish=$env:INPUT_CENTRAL" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ steps.inputs.outputs.releaseTag }}
          fetch-depth: 0

      - name: Run production GA release readiness gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ steps.inputs.outputs.targetRef }}
          RELEASE_TAG: ${{ steps.inputs.outputs.releaseTag }}
          COVERAGE_CSV: ${{ steps.inputs.outputs.coverageCsv }}
          EVIDENCE_SCOPE: ${{ steps.inputs.outputs.evidenceScope }}
          REQUIRE_MANAGED_HA: ${{ steps.inputs.outputs.requireManagedStagingHa }}
          REQUIRE_COVERAGE: ${{ steps.inputs.outputs.requireApplicationMigrationCoverage }}
          REQUIRE_CENTRAL: ${{ steps.inputs.outputs.requireMavenCentralPublish }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          STAGING_REDIS_URI: ${{ secrets.STAGING_REDIS_URI }}
          STAGING_POSTGRES_URL: ${{ secrets.STAGING_POSTGRES_URL }}
          STAGING_POSTGRES_USER: ${{ secrets.STAGING_POSTGRES_USER }}
          STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          STAGING_MSSQL_URL: ${{ secrets.STAGING_MSSQL_URL }}
          STAGING_MSSQL_USER: ${{ secrets.STAGING_MSSQL_USER }}
          STAGING_MSSQL_PASSWORD: ${{ secrets.STAGING_MSSQL_PASSWORD }}
        run: |
          $arguments = @{
            Repository = $env:REPOSITORY
            TargetRef = $env:TARGET_REF
            ReleaseTag = $env:RELEASE_TAG
            CoverageCsvPath = $env:COVERAGE_CSV
            EvidenceScope = $env:EVIDENCE_SCOPE
            SummaryPath = "./target/ga-release-readiness-summary.md"
          }
          if ($env:REQUIRE_MANAGED_HA -eq "true") {
            $arguments.RequireManagedStagingHa = $true
          }
          if ($env:REQUIRE_COVERAGE -eq "true") {
            $arguments.RequireApplicationMigrationCoverage = $true
          }
          if ($env:REQUIRE_CENTRAL -eq "true") {
            $arguments.RequireMavenCentralPublish = $true
          }
          ./tools/ci/check-ga-release-readiness.ps1 @arguments

      - name: Publish readiness summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./target/ga-release-readiness-summary.md) {
            Get-Content ./target/ga-release-readiness-summary.md >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload readiness summary
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: production-ga-release-readiness
          path: target/ga-release-readiness-summary.md
          if-no-files-found: warn
          retention-days: 30
