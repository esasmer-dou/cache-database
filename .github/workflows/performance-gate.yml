name: Redis Performance Gate

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Existing approved EmaTech namespace
        required: true
        type: string
      pod:
        description: Existing idle fresh six-hour benchmark pod, never provisioned here
        required: true
        type: string
      pod_uid:
        description: Independently approved existing pod UID
        required: true
        type: string
      deadline_epoch:
        description: Existing approved absolute UTC execution cutoff, Unix seconds
        required: true
        type: string
      container:
        description: Existing benchmark container
        required: true
        type: string
      workspace:
        description: Clean checkout of this exact Git SHA below /workspace
        required: true
        type: string
      redis:
        description: Exclusive disposable co-located Redis, 127.0.0.1:port
        required: true
        type: string
      baseline_jar:
        description: Preserved original 0.18.1 benchmark JAR, not a candidate rebuild
        required: true
        type: string
      baseline_sha256:
        description: Independently recorded original baseline hash
        required: true
        type: string
      cpus:
        description: Approved child ActiveProcessorCount, identical for every pair
        required: true
        type: choice
        options: ['1', '2']
      container_cpu_limit:
        description: Exact approved benchmark container CPU limit and request
        required: true
        type: string
      pod_cpu_limit:
        description: Exact approved regular-container CPU-limit sum, including Redis 1
        required: true
        type: string
      memory_limit:
        description: Exact approved benchmark memory limit, at least 2Gi
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cachedb-ematech-performance
  cancel-in-progress: false

jobs:
  redis-performance:
    environment: cachedb-performance-ematech
    runs-on: [self-hosted, linux, cachedb-ematech-control]
    timeout-minutes: 180
    steps:
      - name: Seal the non-renewable cap before checkout
        shell: bash
        run: |
          set -eu
          printf 'CACHEDB_CI_CAP_EPOCH=%s\n' "$(( $(date +%s) + 10800 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Execute paired Redis gate only in the approved EmaTech pod
        id: gates
        uses: ./.github/actions/cachedb-redis-performance
        with:
          namespace: ${{ inputs.namespace }}
          pod: ${{ inputs.pod }}
          pod-uid: ${{ inputs.pod_uid }}
          deadline-epoch: ${{ inputs.deadline_epoch }}
          container: ${{ inputs.container }}
          workspace: ${{ inputs.workspace }}
          redis: ${{ inputs.redis }}
          baseline-jar: ${{ inputs.baseline_jar }}
          baseline-sha256: ${{ inputs.baseline_sha256 }}
          cpus: ${{ inputs.cpus }}
          container-cpu-limit: ${{ inputs.container_cpu_limit }}
          pod-cpu-limit: ${{ inputs.pod_cpu_limit }}
          memory-limit: ${{ inputs.memory_limit }}
      - name: Publish summary without suppressing failed gates
        if: always()
        shell: bash
        env:
          EVIDENCE: ${{ steps.gates.outputs.evidence-directory }}
        run: |
          set -eu
          if test -n "$EVIDENCE"; then
            summary="$EVIDENCE/raw/$EVIDENCE/paired/comparison.md"
            if test -f "$summary"; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
          fi
      - name: Preserve performance evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redis-performance-${{ github.sha }}
          path: target/ci-redis-*/
          if-no-files-found: error
          retention-days: 30
