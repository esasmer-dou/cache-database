spring:
  sql:
    init:
      schema-locations: classpath:schema.sql,classpath:schema-controls.sql
      mode: always

cachedb:
  profile: development
  admin:
    enabled: true
    http-enabled: true
    dashboard-enabled: true

sample:
  controls:
    supplier-token: ${SAMPLE_CONTROLS_SUPPLIER_TOKEN:demo-supplier}
    tenant-a-token: ${SAMPLE_CONTROLS_TENANT_A_TOKEN:demo-shop-a}
    tenant-b-token: ${SAMPLE_CONTROLS_TENANT_B_TOKEN:demo-shop-b}
  scheduled-warm:
    enabled: true
  demo:
    write-tools-enabled: true

management:
  endpoint:
    health:
      show-details: always
