apiVersion: v1
kind: Namespace
metadata:
  name: cachedb-v017-validation
  labels:
    app.kubernetes.io/part-of: cachedb-validation
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.24
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validator
  namespace: cachedb-v017-validation
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: validation-budget
  namespace: cachedb-v017-validation
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 12Gi
    limits.cpu: "10"
    limits.memory: 20Gi
    requests.ephemeral-storage: 12Gi
    limits.ephemeral-storage: 32Gi
    pods: "16"
    services: "12"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: cachedb-v017-validation
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      default:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: workspace
  namespace: cachedb-v017-validation
  labels:
    app.kubernetes.io/name: cachedb-validator
    app.kubernetes.io/component: workspace
spec:
  serviceAccountName: validator
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: maven
      image: maven:3.9.9-eclipse-temurin-21
      imagePullPolicy: IfNotPresent
      workingDir: /workspace
      command: ["sh", "-c", "exec sleep 604800"]
      env:
        - name: HOME
          value: /workspace
        - name: MAVEN_CONFIG
          value: /workspace/.m2
        - name: MAVEN_OPTS
          value: -Xmx1536m -XX:ActiveProcessorCount=2 -Duser.home=/workspace
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
          ephemeral-storage: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 12Gi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      readinessProbe:
        exec:
          command: ["sh", "-c", "test -w /workspace"]
        periodSeconds: 10
        timeoutSeconds: 2
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: temp
          mountPath: /tmp
  volumes:
    - name: workspace
      emptyDir:
        sizeLimit: 10Gi
    - name: temp
      emptyDir:
        sizeLimit: 1Gi
