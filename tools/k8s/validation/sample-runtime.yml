# Disposable validation only: configure sample-runtime and initialize its dedicated SQL schema first.
apiVersion: v1
kind: Service
metadata: {name: artifacts, namespace: cachedb-v017-validation}
spec:
  selector: {app.kubernetes.io/component: workspace}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: sample-api, namespace: cachedb-v017-validation}
spec:
  selector: {app.kubernetes.io/name: cachedb-sample-api}
  ports: [{port: 8091, targetPort: 8091}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sample-api, namespace: cachedb-v017-validation}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: cachedb-sample-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cachedb-sample-api}
    spec:
      serviceAccountName: validator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: maven:3.9.9-eclipse-temurin-21
          command: [sh, -ceu]
          args:
            - |
              curl --fail --silent --show-error --max-time 120 "$ARTIFACT_URL" -o /app/sample.jar
              printf '%s  /app/sample.jar\n' "$ARTIFACT_SHA256" | sha256sum -c -
              exec java -jar /app/sample.jar
          envFrom: [{configMapRef: {name: sample-runtime}}]
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: client}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: fixture-auth, key: password}}
          ports: [{containerPort: 8091}]
          resources:
            requests: {cpu: 100m, memory: 384Mi, ephemeral-storage: 128Mi}
            limits: {cpu: 500m, memory: 768Mi, ephemeral-storage: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8091}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8091}
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - {name: app, mountPath: /app}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: app, emptyDir: {sizeLimit: 256Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sample-worker, namespace: cachedb-v017-validation}
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: cachedb-sample-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cachedb-sample-worker}
    spec:
      serviceAccountName: validator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: maven:3.9.9-eclipse-temurin-21
          command: [sh, -ceu]
          args:
            - |
              curl --fail --silent --show-error --max-time 120 "$ARTIFACT_URL" -o /app/sample.jar
              printf '%s  /app/sample.jar\n' "$ARTIFACT_SHA256" | sha256sum -c -
              exec java -jar /app/sample.jar
          envFrom: [{configMapRef: {name: sample-runtime}}]
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: worker}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: fixture-auth, key: password}}
          resources:
            requests: {cpu: 100m, memory: 384Mi, ephemeral-storage: 128Mi}
            limits: {cpu: 500m, memory: 768Mi, ephemeral-storage: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app, mountPath: /app}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: app, emptyDir: {sizeLimit: 256Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
