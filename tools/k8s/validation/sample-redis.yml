# Disposable fixture only. Supply an explicit cachedb-* namespace with kubectl -n.
# Create a fresh fixture; never apply this over an existing/shared Redis.
apiVersion: v1
kind: Service
metadata:
  name: cachedb-sample-redis
  labels: {app.kubernetes.io/part-of: cachedb-sample-redis-check}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: cachedb-sample-redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cachedb-sample-redis
  labels: {app.kubernetes.io/part-of: cachedb-sample-redis-check}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: cachedb-sample-redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {cachedb-redis-client: "true"}
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: v1
kind: Pod
metadata:
  name: cachedb-sample-redis
  labels:
    app.kubernetes.io/name: cachedb-sample-redis
    app.kubernetes.io/part-of: cachedb-sample-redis-check
spec:
  activeDeadlineSeconds: 900
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: redis
      image: redis:8.2.1-alpine3.22@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
      command: [sh, -ec]
      args:
        - |
          umask 077
          password=$(tr -d '\r\n' < /var/run/cachedb-fixture/password)
          test -n "$password"
          hash=$(printf %s "$password" | sha256sum)
          unset password
          printf 'user default on #%s ~* &* +@all\n' "${hash%% *}" > /tmp/fixture.acl
          exec redis-server --bind 0.0.0.0 --protected-mode yes \
            --aclfile /tmp/fixture.acl --port 6379 --save '' --appendonly no \
            --maxmemory 256mb --maxmemory-policy noeviction
      ports: [{name: redis, containerPort: 6379}]
      resources:
        requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 32Mi}
        limits: {cpu: 500m, memory: 384Mi, ephemeral-storage: 128Mi}
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      startupProbe:
        tcpSocket: {port: redis}
        periodSeconds: 2
        failureThreshold: 15
      readinessProbe:
        # BusyBox timeout leaves an orphan watchdog under Redis PID 1.
        # Authenticated PING remains mandatory in the runtime admission gate.
        tcpSocket: {port: redis}
        periodSeconds: 3
        timeoutSeconds: 3
        failureThreshold: 2
      volumeMounts:
        - {name: auth, mountPath: /var/run/cachedb-fixture, readOnly: true}
        - {name: tmp, mountPath: /tmp}
        - {name: data, mountPath: /data}
  volumes:
    - name: auth
      secret:
        secretName: fixture-auth
        defaultMode: 288
        items: [{key: password, path: password}]
    - name: tmp
      emptyDir: {sizeLimit: 16Mi}
    - name: data
      emptyDir: {sizeLimit: 16Mi}
