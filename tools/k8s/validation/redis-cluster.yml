apiVersion: v1
kind: Service
metadata: {name: redis-cluster, namespace: cachedb-v017-validation}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: cachedb-redis-cluster}
  ports:
    - {name: redis, port: 6379}
    - {name: bus, port: 16379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis-cluster, namespace: cachedb-v017-validation}
spec:
  serviceName: redis-cluster
  replicas: 6
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: cachedb-redis-cluster}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cachedb-redis-cluster}
    spec:
      serviceAccountName: validator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: cachedb-redis-cluster}
      containers:
        - name: redis
          image: redis:8.2.1-alpine3.22@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
          command: [sh, -c]
          args:
            - exec redis-server --bind 0.0.0.0 --protected-mode no --port 6379 --dir /data --save '' --appendonly no --maxmemory 48mb --maxmemory-policy noeviction --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 3000 --cluster-announce-ip "$POD_IP"
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi, ephemeral-storage: 32Mi}
            limits: {cpu: 250m, memory: 128Mi, ephemeral-storage: 128Mi}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
            timeoutSeconds: 2
          ports:
            - {name: redis, containerPort: 6379}
            - {name: bus, containerPort: 16379}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 64Mi}
        - name: temp
          emptyDir: {sizeLimit: 32Mi}
